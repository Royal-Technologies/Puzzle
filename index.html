<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puzzle PNG Generator — Bright Path | Royal Technologies</title>
  <!-- Favicon 🧩 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  <script>
    // Universal Canvas roundRect polyfill for maximum browser compatibility
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (r === undefined) r = 0;
        if (typeof r === 'number') r = [r, r, r, r];
        var tl = r[0] || 0, tr = r[1] || r[0] || 0, br = r[2] || r[0] || 0, bl = r[3] || r[1] || r[0] || 0;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        return this;
      };
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-theme="dark">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-logo">
        <span class="logo-icon">🧩</span>
        <div class="logo-text">
          <span class="logo-title">Puzzle Generator</span>
          <span class="logo-subtitle">Bright Path</span>
        </div>
      </div>
      <!-- UI Theme Toggle -->
      <div class="navbar-actions">
        <button id="btn-ui-theme" class="theme-toggle-btn" title="Toggle UI Light/Dark mode">
          <span id="theme-icon">🌙</span> <span id="theme-label">Dark Mode</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="main-layout">

    <!-- LEFT: Controls Panel (Wider: 480px) -->
    <aside class="controls-panel">

      <!-- Row 1: Puzzle Category (10 Types) + Sub Type in ONE row -->
      <div class="control-row">
        <div class="control-group">
          <label class="control-label" for="puzzle-type-select">Puzzle Category (10)</label>
          <select id="puzzle-type-select" class="subtype-select type-select">
            <option value="geometry">🔺 1. Geometry</option>
            <option value="sudoku">🔢 2. Sudoku</option>
            <option value="number-sequence">🔢 3. Sequence</option>
            <option value="matchstick">🔥 4. Matchstick</option>
            <option value="logic">🧠 5. Logic</option>
            <option value="clock-calendar">🕐 6. Clock &amp; Time</option>
            <option value="word-puzzle">📝 7. Word &amp; Rebus</option>
            <option value="visual-iq">🎯 8. Visual IQ</option>
            <option value="missing-number">❓ 9. Missing Number</option>
            <option value="visual-pattern">👁️ 10. Pattern</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label" for="subtype-select">Sub Type</label>
          <select id="subtype-select" class="subtype-select"></select>
        </div>
      </div>

      <!-- Difficulty -->
      <div class="control-group">
        <label class="control-label">Difficulty</label>
        <div class="difficulty-btns" id="difficulty-btns">
          <button class="diff-btn active" data-diff="easy">Easy</button>
          <button class="diff-btn" data-diff="medium">Medium</button>
          <button class="diff-btn" data-diff="hard">Hard</button>
        </div>
      </div>

      <!-- Row 2: Canvas Background / Style + Header Title Style in ONE row -->
      <div class="control-row">
        <div class="control-group">
          <label class="control-label" for="canvas-bg-select">Canvas Background</label>
          <select id="canvas-bg-select" class="subtype-select">
            <option value="cream-paper" selected>📜 Cream Paper</option>
            <option value="clean-white">⚪ Clean White</option>
            <option value="warm-parchment">📜 Warm Parchment</option>
            <option value="dark-slate">🌙 Dark Slate</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label" for="title-style-select">Header Title</label>
          <select id="title-style-select" class="subtype-select">
            <option value="nopen" selected>⚡ "NO PEN! NO PAPER!!"</option>
            <option value="puzzle">🏷️ Puzzle Title</option>
          </select>
        </div>
      </div>

      <!-- Buttons -->
      <div class="action-buttons">
        <button class="btn-generate" id="btn-generate">
          🎲 Generate Puzzle
        </button>
        <button class="btn-export" id="btn-export">
          📥 Export 1080×1080 PNG
        </button>
      </div>

      <!-- Answer Box -->
      <div class="info-box answer-box" id="answer-box" style="display:none;">
        <div class="info-header">
          <div class="info-label-group">
            <span class="info-label">✅ Solution &amp; Answer</span>
            <span id="validation-badge" class="badge-verified">Verified ✓</span>
          </div>
          <button id="btn-toggle-answer" class="btn-mini-toggle">Show</button>
        </div>
        <div class="info-text-wrapper" id="answer-wrapper" style="display:none;">
          <span class="info-text" id="answer-text"></span>
        </div>
      </div>

      <!-- Hint Box -->
      <div class="info-box hint-box" id="hint-box" style="display:none;">
        <span class="info-label">💡 Hint:</span>
        <span class="info-text" id="hint-text"></span>
      </div>

    </aside>

    <!-- RIGHT: Canvas Preview (Compact & Scaled to Fit) -->
    <section class="canvas-section">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <div class="canvas-placeholder" id="canvas-placeholder">
          <span class="placeholder-icon">🧩</span>
          <span class="placeholder-text">Click <strong>Generate Puzzle</strong> to preview</span>
        </div>
        <canvas id="puzzle-canvas" width="1080" height="1080"></canvas>
      </div>
      <div class="canvas-meta-bar">
        <span class="meta-tag">📐 1080 × 1080 PNG Full Resolution</span>
        <span class="meta-tag">🎨 Bright Path</span>
        <span class="meta-tag">⚡ Facebook Ready</span>
      </div>
    </section>

  </main>

  <!-- ===== FOOTER (Only place for royaltechbd.com) ===== -->
  <footer class="site-footer">
    <span>© 2025 Royal Technologies</span>
    <span class="footer-sep">|</span>
    <a href="https://www.royaltechbd.com/" target="_blank" rel="noopener">royaltechbd.com</a>

  <script src="generators/sudoku.js"></script>
  <script src="generators/number-sequence.js"></script>
  <script src="generators/matchstick.js"></script>
  <script src="generators/logic.js"></script>
  <script src="generators/clock-calendar.js"></script>
  <script src="generators/word-puzzle.js"></script>
  <script src="generators/visual-iq.js"></script>
  <script src="generators/missing-number.js"></script>
  <script src="generators/visual-pattern.js"></script>
  <script src="templates/modern-clean.js"></script>
  <script src="export/png-export.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
